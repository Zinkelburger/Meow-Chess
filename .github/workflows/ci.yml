# Shared release gate; also runnable without publishing a release.
name: CI

on:
  push:
    branches: [main, windows-check]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            device: linux
          - os: windows-2022
            device: windows
          - os: windows-2025
            device: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      MEOW_EXPORT_FIXTURES: '1'
      MEOW_CHESS_DESKTOP_SETUP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config libgtk-3-dev libsecret-1-dev libjson-glib-dev xvfb libgl1-mesa-dri
      - run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze lib test integration_test tools
      - name: Architecture and documentation lint
        run: python scripts/lint.py
      - name: Install independent DBF reader
        run: python -m pip install dbfread==2.0.7
      - name: Prepare evidence directory
        run: python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
      - name: Unit and widget tests
        run: flutter test --concurrency=2 --reporter expanded --file-reporter json:artifacts/unit-tests.json
      - name: Independently validate US Chess export fixtures
        run: python scripts/verify_dbf.py artifacts/dbf-contract
      - name: DBF validator negative controls
        run: python scripts/test_dbf_validator.py artifacts/dbf-contract
      - name: Abrupt process termination and SQLite recovery
        run: python scripts/verify_recovery.py
      - name: Linux desktop tournament day
        if: runner.os == 'Linux'
        env:
          MEOW_DATA_DIR: ${{ runner.temp }}/meow-test-library
        run: |
          for target in integration_test/*_test.dart; do
            name=$(basename "$target" .dart)
            xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- \
              flutter test "$target" -d linux --reporter expanded \
              --file-reporter "json:artifacts/desktop-$name.json"
          done
      - name: Windows desktop tournament day
        if: runner.os == 'Windows'
        env:
          MEOW_DATA_DIR: ${{ runner.temp }}/meow-test-library
        shell: pwsh
        run: |
          foreach ($target in Get-ChildItem integration_test/*_test.dart) {
            flutter test $target.FullName -d windows --reporter expanded --file-reporter "json:artifacts/desktop-$($target.BaseName).json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
