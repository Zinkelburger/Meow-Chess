# Analysis, architecture lint and unit/widget tests. Runs on every push and
# pull request, and is the quality gate release.yml waits on.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze lib test integration_test tools/recovery_fixture.dart

      - name: Architecture and documentation lint
        run: python3 scripts/lint.py

      - name: Test
        run: flutter test --concurrency=2
