# Shared release gate; also runnable without publishing a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes the running checks; pushes
# to main and release calls always run to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            device: linux
          - os: windows-2022
            device: windows
          - os: windows-2025
            device: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      MEOW_EXPORT_FIXTURES: '1'
      MEOW_CHESS_DESKTOP_SETUP: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang pkg-config libgtk-3-dev libsecret-1-dev libjson-glib-dev xvfb libgl1-mesa-dri
      - run: flutter pub get --enforce-lockfile
      - name: Analyze
        run: flutter analyze lib test integration_test tools scripts
      - name: Architecture and documentation lint
        # bash -e on every OS: Windows' default pwsh would only fail the step
        # on the last command's exit code.
        shell: bash
        run: |
          python scripts/test_lint.py
          python scripts/test_check_exports.py
          python scripts/test_toolchain.py
          if [[ "$RUNNER_OS" == Linux ]]; then python tools/test_install_linux_launcher.py; fi
          python scripts/lint.py
      - name: Install independent DBF reader
        run: python -m pip install dbfread==2.0.7
      - name: Prepare evidence directory
        run: python -c "from pathlib import Path; Path('artifacts').mkdir(exist_ok=True)"
      - name: Unit and widget tests
        run: flutter test --concurrency=2 --reporter expanded --file-reporter json:artifacts/unit-tests.json
      - name: Independently validate DBFs and exercise fragile mock importer
        run: python scripts/check_exports.py --validate-only
      - name: Build MCP server
        run: dart build cli --target=tools/tournament_mcp.dart --output=build/tournament-cli
      - name: Exercise MCP through the portable launcher
        run: python scripts/test_tournament_mcp.py
      - name: Boylston reports replayed against US Chess rated records
        if: runner.os == 'Linux'
        run: |
          python scripts/test_boylston_replay.py
      - name: Abrupt process termination and SQLite recovery
        run: python scripts/verify_recovery.py
      - name: Linux desktop tournament day
        if: runner.os == 'Linux'
        env:
          MEOW_DATA_DIR: ${{ runner.temp }}/meow-test-library
        run: |
          for target in integration_test/*_test.dart; do
            name=$(basename "$target" .dart)
            xvfb-run -a -s '-screen 0 1440x1000x24' dbus-run-session -- \
              flutter test "$target" -d linux --reporter expanded \
              --file-reporter "json:artifacts/desktop-$name.json"
          done
      - name: Windows desktop tournament day
        if: runner.os == 'Windows'
        env:
          MEOW_DATA_DIR: ${{ runner.temp }}/meow-test-library
        shell: pwsh
        run: |
          foreach ($target in Get-ChildItem integration_test/*_test.dart) {
            flutter test $target.FullName -d windows --reporter expanded --file-reporter "json:artifacts/desktop-$($target.BaseName).json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-evidence-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  macos-artifacts:
    name: macOS file publication and access
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Test the Dart file boundaries
        run: flutter test test/infrastructure/artifact_file_test.dart test/infrastructure/artifact_save_test.dart test/infrastructure/event_save_test.dart test/infrastructure/file_access_test.dart
      # The same rating reports, written on macOS and checked by the
      # independent reader, so a platform difference cannot reach a TD's DBF.
      - name: Write the DBF fixtures on macOS
        env:
          MEOW_EXPORT_FIXTURES: '1'
        run: >-
          flutter test test/infrastructure/rating_contract_test.dart
          test/infrastructure/dbf_importer_test.dart
          test/infrastructure/dbf_byte_contract_test.dart
          test/infrastructure/section_time_control_test.dart
          test/infrastructure/import_reports_test.dart
      - name: Independently validate the macOS DBFs
        run: |
          python -m pip install dbfread==2.0.7
          python scripts/check_exports.py --validate-only
      - name: Compile the macOS application
        run: flutter build macos --debug
      # Signed ad hoc, not unsigned: the App Sandbox entitlements only apply to
      # a signed app, and the bookmark and publication paths differ inside it.
      - name: Test Foundation staging, publication and bookmarks
        env:
          MEOW_DATA_DIR: ${{ runner.temp }}/meow-native-tests
        run: >-
          xcodebuild test -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Debug -destination 'platform=macOS'
          -resultBundlePath artifacts/macos-publication.xcresult
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-evidence-macos-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
