# Builds and publishes a GitHub Release when a version tag is pushed:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Linux: portable zip, .deb, .rpm and .flatpak. Windows: portable zip and a
# setup .exe. All downloads and checksums are published without a description.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gate:
    uses: ./.github/workflows/ci.yml

  build-linux:
    needs: quality-gate
    # The oldest supported runner sets the glibc floor for the binaries.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang pkg-config libgtk-3-dev \
            libsecret-1-dev libjson-glib-dev rpm \
            flatpak flatpak-builder

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Flutter's build name must be plain x.y.z; 1.2.0-rc1 builds as 1.2.0.
          echo "build_name=${VERSION%%-*}" >> "$GITHUB_OUTPUT"

      - name: Build Linux release
        run: flutter build linux --release --build-name=${{ steps.version.outputs.build_name }}

      - name: Check the bundle carries what desktop setup needs
        run: |
          B=build/linux/x64/release/bundle
          test -x $B/meow_chess
          test -s $B/data/org.meowchess.meow_chess.xml
          test -s $B/data/flutter_assets/assets/icon/meow_chess.png

      - name: Zip bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r "$GITHUB_WORKSPACE/meow-chess-${{ github.ref_name }}-linux.zip" .

      - name: Build .deb
        run: |
          packaging/deb/build_deb.sh ${{ github.ref_name }} build/linux/x64/release/bundle dist
          mv dist/meow-chess-${{ steps.version.outputs.version }}-linux-amd64.deb \
             meow-chess-${{ github.ref_name }}-linux-amd64.deb

      - name: Install the .deb and check the file type registers
        run: |
          sudo apt-get install -y ./meow-chess-${{ github.ref_name }}-linux-amd64.deb
          # dpkg's shared-mime-info trigger rebuilt the MIME database, and the
          # desktop entry claims the type (GLib reads that line directly).
          grep -F 'application/x-meow-chess:*.meow' /usr/share/mime/globs2
          grep -Fx 'MimeType=application/x-meow-chess;' \
            /usr/share/applications/org.meowchess.meow_chess.desktop
          test -x "$(readlink -f /usr/bin/meow_chess)"
          sudo apt-get remove -y meow-chess

      - name: Build .rpm
        run: |
          packaging/rpm/build_rpm.sh ${{ github.ref_name }} build/linux/x64/release/bundle dist
          mv dist/meow-chess-${{ steps.version.outputs.version }}-linux-x86_64.rpm \
             meow-chess-${{ github.ref_name }}-linux-x86_64.rpm

      - name: Build Flatpak bundle
        run: |
          # The runtime branch the manifest names, so the two never drift apart.
          BRANCH="$(sed -n "s/^runtime-version: '\(.*\)'$/\1/p" packaging/flatpak/org.meowchess.meow_chess.yml)"
          test -n "$BRANCH"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub "org.freedesktop.Platform//$BRANCH" "org.freedesktop.Sdk//$BRANCH"
          flatpak-builder --user --force-clean --disable-rofiles-fuse --repo=flatpak-repo flatpak-build \
            packaging/flatpak/org.meowchess.meow_chess.yml
          flatpak build-bundle flatpak-repo \
            meow-chess-${{ github.ref_name }}-linux.flatpak org.meowchess.meow_chess

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            meow-chess-${{ github.ref_name }}-linux.zip
            meow-chess-${{ github.ref_name }}-linux-amd64.deb
            meow-chess-${{ github.ref_name }}-linux-x86_64.rpm
            meow-chess-${{ github.ref_name }}-linux.flatpak

  # The .rpm is built on Ubuntu; install it where it is meant to go, so its
  # Requires must resolve from the distribution's own repositories. Flatpak is
  # not install-tested: it needs a session bus and a second runtime download,
  # and flatpak-builder already validated its manifest and exports.
  test-rpm:
    needs: build-linux
    name: Install the .rpm (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: fedora:latest
            install: dnf install -y
          - image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install --allow-unsigned-rpm
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-build

      - name: Install the .rpm and check the files and libraries
        run: |
          # grep is for the checks below; minimal images may not have it.
          ${{ matrix.install }} grep ./meow-chess-${{ github.ref_name }}-linux-x86_64.rpm
          test -x "$(readlink -f /usr/bin/meow_chess)"
          test -s /usr/share/mime/packages/org.meowchess.meow_chess.xml
          test -s /usr/share/icons/hicolor/256x256/apps/org.meowchess.meow_chess.png
          grep -Fx 'MimeType=application/x-meow-chess;' \
            /usr/share/applications/org.meowchess.meow_chess.desktop
          # Every host library the app and the plugins it links load came in
          # with the package's Requires. The loader lists them itself, so ldd
          # need not be installed.
          if ! listing="$(/lib64/ld-linux-x86-64.so.2 --list /opt/meow-chess/meow_chess)" ||
              grep 'not found' <<<"$listing"; then
            echo "::error::meow_chess has unresolved libraries"
            exit 1
          fi

  build-windows:
    needs: quality-gate
    uses: ./.github/workflows/windows-build.yml
    with:
      version: ${{ github.ref_name }}

  release:
    needs: [build-linux, test-rpm, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: '*-build'
          merge-multiple: true

      - name: Publish download checksums
        run: |
          cd artifacts
          sha256sum meow-chess-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          # Tags with a dash (v1.2.0-rc1) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Meow-Chess ${{ github.ref_name }}
          body: ""
