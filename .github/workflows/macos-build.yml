# The Mac download: the app in a zip, unsigned by any Apple developer account
# (ad hoc signed, as Xcode signs any app), so a Mac asks once before opening it
# (docs/USING.md). Called by release.yml with the tag, and runnable by hand
# (Actions > macOS build > Run workflow) to try a Mac build without releasing.
# Nothing here publishes.

name: macOS build

on:
  workflow_call:
    inputs:
      version:
        description: The tag in the artifact names, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: A name for the artifacts, e.g. v0.0.0-check
        required: true
        default: v0.0.0-check
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MEOW_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Version from the input
        run: |
          if ! [[ "$MEOW_RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Version must be a v-prefixed semantic version, such as v0.2.0 or v0.2.0-rc1"
            exit 1
          fi
          VERSION="${MEOW_RELEASE_VERSION#v}"
          # Flutter's build name must be plain x.y.z; 1.2.0-rc1 builds as 1.2.0.
          echo "BUILD_NAME=${VERSION%%-*}" >> "$GITHUB_ENV"

      - run: flutter pub get --enforce-lockfile

      - name: Build macOS release
        run: flutter build macos --release --build-name="$BUILD_NAME"

      # ditto keeps the app's symlinks, permissions and signature, which a
      # plain zip of an .app can break ("the app is damaged").
      - name: Zip the app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/Meow Chess.app" \
            "meow-chess-${MEOW_RELEASE_VERSION}-macos.zip"

      - name: Install the smoke test's window reader
        run: python -m pip install pyobjc-framework-Quartz==11.1

      # Unzip the download as a TD would, check what a Mac checks before
      # running it, open it and wait for its window, then quit it.
      - name: Open the downloaded app
        run: >-
          python scripts/smoke_macos.py
          "meow-chess-${MEOW_RELEASE_VERSION}-macos.zip"
          --expected-version "$BUILD_NAME"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-build
          path: meow-chess-${{ inputs.version }}-macos.zip
