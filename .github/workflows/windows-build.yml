# The Windows build: the app, the portable zip and the setup, which is
# installed silently on the runner as a check. Called by release.yml with the
# tag, and runnable by hand (Actions > Windows build > Run workflow) to try a
# Windows build without releasing. Nothing here publishes.

name: Windows build

on:
  workflow_call:
    inputs:
      version:
        description: The tag in the artifact names, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: A name for the artifacts, e.g. v0.0.0-check
        required: true
        default: v0.0.0-check
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      MEOW_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Validate artifact version
        shell: pwsh
        run: |
          if ($env:MEOW_RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9.-]+)?$') {
            throw 'Version must be a v-prefixed semantic version, such as v0.2.0 or v0.2.0-rc1'
          }

      - name: Build Windows release
        shell: pwsh
        run: |
          $version = $env:MEOW_RELEASE_VERSION.TrimStart("v")
          # Flutter's build name must be plain x.y.z; 1.2.0-rc1 builds as 1.2.0.
          $buildName = $version.Split("-")[0]
          flutter build windows --release --build-name=$buildName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # A clean Windows has no Visual C++ runtime; without these beside the
      # exe the app cannot start (windows/CMakeLists.txt deploys them).
      - name: Verify the VC++ runtime is bundled
        shell: pwsh
        run: |
          $bundle = "build/windows/x64/runner/Release"
          $missing = @()
          foreach ($dll in @('meow_chess.exe','MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll')) {
            if (-not (Test-Path (Join-Path $bundle $dll))) { $missing += $dll }
          }
          if ($missing.Count -gt 0) {
            Write-Host "Bundle is missing: $($missing -join ', ')"
            Get-ChildItem $bundle | Select-Object -ExpandProperty Name
            exit 1
          }

      - name: Zip bundle (portable)
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "meow-chess-${env:MEOW_RELEASE_VERSION}-windows.zip"

      # Inno Setup 6 ships on the hosted Windows image; choco is the fallback
      # for when an image update drops it, pinned to 6 because 7 installs to a
      # different folder and has not been qualified with installer.iss.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version=6.7.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 is not at $iscc" }
          $version = $env:MEOW_RELEASE_VERSION.TrimStart("v")
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist\meow-chess-$version-windows-setup.exe" "meow-chess-${env:MEOW_RELEASE_VERSION}-windows-setup.exe"

      # The upgrade TDs will actually run: from the latest published release.
      # A tag build runs before its own release is published, so "latest" is
      # the one before it.
      - name: Download the previous release's setup
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'previous-release'
          $output = gh release download --repo $env:GITHUB_REPOSITORY --pattern '*-windows-setup.exe' --dir $dir 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            # Only a missing release or asset means there is nothing to upgrade
            # from; a network or auth failure must not quietly skip the upgrade.
            if ($output -match 'release not found|no assets match') {
              Write-Host '::notice::No previous Windows setup to upgrade from; testing a reinstall instead'
              exit 0
            }
            Write-Host $output
            throw "Could not download the previous release's Windows setup"
          }
          $setup = Get-ChildItem $dir -Filter '*-windows-setup.exe' | Select-Object -First 1
          Write-Host "Upgrading from $($setup.Name)"
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT

      # Upgrade over the previous release, check files and the .meow
      # association, launch it, then uninstall: refused while open, clean once
      # closed, tournament library kept.
      - name: Upgrade, launch and uninstall the setup
        shell: pwsh
        env:
          PREVIOUS_SETUP: ${{ steps.previous.outputs.path }}
        run: |
          ./scripts/test_windows_installer.ps1 `
            -Setup "meow-chess-${env:MEOW_RELEASE_VERSION}-windows-setup.exe" `
            -PreviousSetup $env:PREVIOUS_SETUP `
            -ExpectedVersion ($env:MEOW_RELEASE_VERSION.TrimStart('v'))

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            meow-chess-${{ inputs.version }}-windows.zip
            meow-chess-${{ inputs.version }}-windows-setup.exe
